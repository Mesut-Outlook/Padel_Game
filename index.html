<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel Legends</title>
<style>
  [hidden] { display: none !important; }
  :root { --acc: #d8f53a; --bg: rgba(10, 18, 28, 0.88); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1520; color: #fff; font: 15px system-ui, sans-serif; }
  canvas { display: block; }
  .panel { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 30% 20%, #1d3b55, #070d14); z-index: 5; }
  .card { background: var(--bg); padding: 28px 32px; border-radius: 14px; width: min(560px, 92vw); max-height: 90vh; overflow: auto; box-shadow: 0 20px 60px #0008; }
  h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 1px; } h1 b { color: var(--acc); }
  .sub { opacity: .7; margin-bottom: 18px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; font-size: 13px; text-transform: uppercase; opacity: .8; }
  select, input, button { font: inherit; width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid #345; background: #12202e; color: #fff; box-sizing: border-box; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > * { flex: 1 1 140px; }
  button.go { margin-top: 20px; background: var(--acc); color: #111; font-weight: 800; border: 0; cursor: pointer; font-size: 17px; }
  #hud { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); background: var(--bg); padding: 8px 18px; border-radius: 10px; display: flex; gap: 18px; align-items: center; font-weight: 700; z-index: 2; }
  #hud .pts { color: var(--acc); font-size: 22px; min-width: 90px; text-align: center; }
  #msg { white-space: pre-line; position: fixed; top: 34%; left: 50%; transform: translateX(-50%); font-size: 38px; font-weight: 900; text-shadow: 0 3px 12px #000; z-index: 2; pointer-events: none; text-align: center; }
  #cam { position: fixed; right: 12px; bottom: 12px; background: var(--bg); padding: 6px 12px; border-radius: 8px; z-index: 2; font-size: 13px; }
  #help { position: fixed; left: 12px; bottom: 12px; background: var(--bg); padding: 8px 12px; border-radius: 8px; z-index: 2; font-size: 12px; line-height: 1.6; opacity: .85; }
  #replayTag { position: fixed; top: 70px; right: 16px; background: #c1121f; padding: 4px 12px; border-radius: 6px; font-weight: 800; z-index: 2; }
  kbd { background: #234; padding: 1px 6px; border-radius: 4px; }
</style>
</head>
<body>
<div id="menu" class="panel">
  <div class="card">
    <h1>PADEL <b>LEGENDS</b></h1>
    <div class="sub">Hızlı maç · 1–4 oyuncu · AI veya arkadaşlarınla</div>
    <div class="row">
      <div><label>Mod</label><select id="mode"><option value="4">Çiftler (2v2)</option><option value="2">Tekler (1v1)</option></select></div>
      <div><label>İnsan oyuncu</label><select id="humans"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="row">
      <div><label>Karakterin</label><select id="char"></select></div>
      <div><label>AI seviyesi</label><select id="ai"><option value="rookie">Çaylak</option><option value="club" selected>Kulüp</option><option value="pro">Profesyonel</option><option value="legend">Efsane</option></select></div>
    </div>
    <div class="row">
      <div><label>Mekan</label><select id="venue"></select></div>
      <div><label>Raket</label><select id="racket"></select></div>
    </div>
    <div class="row">
      <div><label>Set</label><select id="sets"><option value="1">1 set</option><option value="3" selected>3 set</option></select></div>
      <div><label>Deuce</label><select id="golden"><option value="1">Altın sayı</option><option value="0">Avantaj</option></select></div>
    </div>
    <button class="go" id="start">MAÇA BAŞLA</button>
    <label>Online — arkadaşlarla</label>
    <div class="row">
      <div><input id="room" placeholder="Oda kodu (ör. PADEL1)" maxlength="6"></div>
      <div><button id="online">ODAYA KATIL / KUR</button></div>
    </div>
    <div class="sub" id="lobby" style="margin-top:10px"></div>
  </div>
</div>
<div id="hud" hidden><span id="t0">TAKIM A</span><span id="setsHud"></span><span class="pts" id="pts">0-0</span><span id="t1">TAKIM B</span></div>
<div id="msg"></div>
<div id="cam" hidden></div>
<div id="replayTag" hidden>● TEKRAR</div>
<div id="help" hidden>
  <kbd>WASD</kbd> hareket · <kbd>Space</kbd>/<kbd>J</kbd> vuruş · <kbd>K</kbd> lob · <kbd>L</kbd> smaç · <kbd>U</kbd> chiquita · <kbd>I</kbd> víbora<br>
  Vururken <kbd>A</kbd>/<kbd>D</kbd> = yön · <kbd>C</kbd> kamera · <kbd>R</kbd> tekrar · <kbd>Esc</kbd> tekrarı geç · Gamepad: A vuruş, B lob, Y smaç, X chiquita
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
