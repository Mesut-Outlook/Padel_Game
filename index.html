<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padel Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  [hidden] { display: none !important; }
  :root {
    --acc: #d8f53a;
    --bg: rgba(10, 18, 28, 0.78);
    --court: #2f6fb5;
    --muted: #9fb3c8;
    --border: #ffffff1a;
    --head-font: 'Barlow Condensed', 'Oswald', system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1520; color: #fff; font: 14px system-ui, -apple-system, sans-serif; }
  canvas { display: block; }
  .tabular, .pl-stat-val, .pl-rstat b, .pl-tab-num, #hud .pts { font-variant-numeric: tabular-nums; }

  /* Broadcast Night-Session Menu */
  /* legacy form card: keeps the source-of-truth controls in the DOM, never shown (menu.js builds the real menu) */
  #menu > .card { display: none; }
  .panel {
    position: fixed;
    inset: 0;
    z-index: 5;
    background:
      radial-gradient(circle at 22% 28%, rgba(47, 111, 181, 0.34), transparent 52%),
      radial-gradient(circle at 82% 16%, rgba(216, 245, 58, 0.10), transparent 44%),
      linear-gradient(160deg, #0b1520 0%, #070e17 100%);
    overflow: hidden;
  }
  .pl-shell {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 1480px;
    margin: 0 auto;
    padding: clamp(8px, 1.4vh, 16px) clamp(12px, 1.8vw, 24px);
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.2vh, 14px);
  }
  .pl-bg-court {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* Top Bar */
  .pl-topbar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 14px;
    background: var(--bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    flex: 0 0 auto;
  }
  .pl-brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .pl-logo {
    font-family: var(--head-font);
    font-weight: 800;
    font-size: clamp(24px, 2.5vw, 32px);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    line-height: 1;
    color: #fff;
  }
  .pl-logo span { color: var(--acc); }
  .pl-tour-tag {
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .pl-top-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--muted); }
  .pl-pad-hint {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
  }
  .pl-dev b { color: var(--acc); }

  /* Two-Column Main Layout (~38% / ~62%) */
  .pl-main {
    position: relative;
    z-index: 1;
    flex: 1 1 0;
    min-height: 0;
    display: grid;
    grid-template-columns: 38fr 62fr;
    gap: clamp(10px, 1.4vw, 18px);
  }
  .pl-left-panel, .pl-right-panel {
    background: var(--bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 12px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Left Column: Live 3D Player Preview */
  .pl-left-panel { padding: clamp(10px, 1.4vh, 16px); gap: clamp(8px, 1.2vh, 12px); }
  .pl-preview-stage {
    position: relative;
    flex: 1 1 0;
    min-height: 170px;
    border-radius: 10px;
    background:
      radial-gradient(circle at 50% 62%, rgba(47, 111, 181, 0.35), rgba(11, 21, 32, 0.92) 74%);
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .pl-preview-canvas { width: 100%; height: 100%; display: block; }
  .pl-preview-badge {
    position: absolute;
    top: 8px;
    left: 10px;
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(11, 21, 32, 0.75);
    color: var(--acc);
    border: 1px solid var(--border);
    pointer-events: none;
  }
  .pl-preview-racket-pill {
    position: absolute;
    bottom: 8px;
    right: 10px;
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(11, 21, 32, 0.82);
    color: #fff;
    border: 1px solid var(--border);
    pointer-events: none;
  }
  .pl-char-info { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
  .pl-char-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .pl-char-title-wrap { display: flex; align-items: center; gap: 8px; }
  .pl-char-flag { font-size: 22px; line-height: 1; }
  .pl-char-name {
    margin: 0;
    font-family: var(--head-font);
    font-weight: 800;
    font-size: clamp(20px, 2vw, 26px);
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .pl-char-tags { display: flex; gap: 6px; }
  .pl-meta-pill {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .pl-stats-list { display: flex; flex-direction: column; gap: 5px; }
  .pl-stat-row { display: grid; grid-template-columns: 58px 1fr 24px; align-items: center; gap: 8px; font-size: 12px; }
  .pl-stat-name { color: var(--muted); font-weight: 600; }
  .pl-stat-track { height: 7px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
  .pl-stat-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--court), var(--acc));
    transition: width 180ms ease;
  }
  .pl-stat-val { text-align: right; font-weight: 700; color: #fff; }

  /* Right Column: Tabs + Step Body + Footer */
  .pl-right-panel { padding: clamp(10px, 1.4vh, 16px); gap: clamp(8px, 1.1vh, 12px); }
  .pl-tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    flex: 0 0 auto;
  }
  .pl-tab {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted);
    border-radius: 10px;
    padding: 7px 8px;
    font-family: var(--head-font);
    font-weight: 700;
    font-size: clamp(14px, 1.3vw, 17px);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, color 160ms ease;
  }
  .pl-tab:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .pl-tab-num {
    display: inline-grid;
    place-items: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }
  .pl-tab.is-active {
    color: #0b1520;
    background: var(--acc);
    border-color: var(--acc);
  }
  .pl-tab.is-active .pl-tab-num {
    background: #0b1520;
    color: var(--acc);
  }

  .pl-step-body {
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    padding: 2px 4px 4px 2px;
  }
  .pl-step-body::-webkit-scrollbar { width: 6px; }
  .pl-step-body::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 999px; }

  .pl-section-label {
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 8px 0 6px;
  }
  .pl-section-label:first-child { margin-top: 0; }

  /* Cards & Interactive States */
  .pl-card {
    position: relative;
    appearance: none;
    background: rgba(16, 28, 42, 0.75);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: #fff;
    padding: 10px;
    text-align: left;
    cursor: pointer;
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
  }
  .pl-card:hover {
    transform: translateY(-2px);
    background: rgba(24, 40, 58, 0.88);
  }
  .pl-card.is-selected {
    border: 2px solid var(--acc);
    padding: 9px;
    background: rgba(32, 52, 74, 0.9);
  }
  .pl-check {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--acc);
    color: #0b1520;
    font-size: 12px;
    font-weight: 900;
    display: none;
    place-items: center;
    z-index: 2;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  }
  .pl-card.is-selected .pl-check { display: grid; }

  .pl-card-title {
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.15;
    color: #fff;
  }
  .pl-card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

  /* Keyboard / Gamepad Focus Ring */
  .pl-card:focus-visible, .pl-seg-btn:focus-visible, .pl-tab:focus-visible, .pl-chip:focus-visible,
  .pl-next-btn:focus-visible, .pl-start-btn:focus-visible, .pl-online-toggle:focus-visible,
  .pl-online-btn:focus-visible, .pl-room-input:focus-visible,
  .pad-focus {
    outline: 2px solid var(--acc) !important;
    outline-offset: 2px !important;
  }

  /* Step 1: Mod */
  .pl-mode-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pl-mode-card { display: flex; align-items: center; gap: 12px; padding: 12px; }
  .pl-mode-card.is-selected { padding: 11px; }
  .mode-court-svg { width: 92px; height: 68px; flex: 0 0 auto; border-radius: 6px; }
  .pl-ctrl-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pl-ctrl-card { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 6px; padding: 10px 8px; }
  .pl-ctrl-icons { display: flex; align-items: center; gap: 6px; color: var(--acc); }
  .ctrl-svg { width: 38px; height: 24px; }
  .pl-ctrl-plus { font-weight: 800; color: var(--muted); }
  .pl-gamepad-live { margin-top: 6px; font-size: 12px; color: var(--muted); font-weight: 600; }

  /* Segmented Controls */
  .pl-seg-row {
    display: flex;
    gap: 6px;
    background: rgba(8, 14, 22, 0.65);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .pl-seg-btn {
    flex: 1 1 0;
    appearance: none;
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .pl-seg-btn:hover:not(:disabled) { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .pl-seg-btn.is-selected {
    background: rgba(216, 245, 58, 0.16);
    color: var(--acc);
    border-color: var(--acc);
  }
  .pl-seg-btn:disabled, .pl-seg-btn.is-disabled {
    opacity: 0.32;
    cursor: not-allowed;
  }

  /* Filter Chips */
  .pl-filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .pl-chip {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    padding: 5px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .pl-chip.is-active {
    background: var(--acc);
    color: #0b1520;
    border-color: var(--acc);
  }

  /* Shimmer Skeleton for Thumbs */
  .pl-thumb-box {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: #122233;
  }
  .pl-thumb-box.shimmer::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 25%, rgba(255, 255, 255, 0.12) 50%, transparent 75%);
    transform: translateX(-100%);
    animation: plShimmer 1.25s infinite;
  }
  @keyframes plShimmer {
    100% { transform: translateX(100%); }
  }
  .pl-thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Step 2: Oyuncu (4 columns) */
  .pl-char-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  .pl-char-card { padding: 7px; display: flex; flex-direction: column; gap: 6px; }
  .pl-char-card.is-selected { padding: 6px; }
  .pl-portrait-box { aspect-ratio: 1 / 1; width: 100%; }
  .pl-gender-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(11, 21, 32, 0.78);
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .pl-char-card-meta { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .pl-char-card-flag { font-size: 14px; flex: 0 0 auto; }
  .pl-char-card-name {
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Step 3: Mekan (3 columns) */
  .pl-venue-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .pl-venue-card { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .pl-venue-card.is-selected { padding: 7px; }
  .pl-venue-box { aspect-ratio: 16 / 9; width: 100%; }
  .pl-venue-body { display: flex; flex-direction: column; gap: 3px; }
  .pl-venue-loc { font-size: 12px; color: var(--muted); }
  .pl-venue-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .pl-mini-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    padding: 1px 6px;
    border-radius: 5px;
  }
  .pl-surf-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Step 4: Raket (3 columns) */
  .pl-racket-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }
  .pl-racket-card { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .pl-racket-card.is-selected { padding: 7px; }
  .pl-racket-top { display: flex; align-items: center; gap: 8px; }
  .pl-racket-box { width: 64px; height: 64px; flex: 0 0 64px; }
  .pl-racket-head-info { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pl-racket-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .pl-racket-stats { display: flex; flex-direction: column; gap: 3px; }
  .pl-rstat { display: grid; grid-template-columns: 60px 1fr 18px; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); }
  .pl-bar { height: 5px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; }
  .pl-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--court), var(--acc)); border-radius: 999px; }
  .pl-rstat b { color: #fff; text-align: right; }

  /* Step 5: Maç */
  .pl-match-groups { display: flex; flex-direction: column; gap: 8px; }

  /* Step Footer & Online Collapsible */
  .pl-step-footer {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding-top: 6px;
    border-top: 1px solid var(--border);
  }
  .pl-online-wrap { flex: 1 1 auto; }
  .pl-online-toggle {
    appearance: none;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .pl-online-toggle:hover { color: #fff; background: rgba(255, 255, 255, 0.09); }
  .pl-online-drawer {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    background: rgba(8, 14, 22, 0.85);
    border: 1px solid var(--border);
  }
  .pl-online-controls { display: flex; gap: 8px; align-items: center; }
  .pl-room-input {
    width: 170px;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #12202e;
    color: #fff;
    font: inherit;
    text-transform: uppercase;
  }
  .pl-online-btn {
    width: auto;
    padding: 6px 14px;
    border-radius: 7px;
    border: 1px solid var(--court);
    background: var(--court);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }
  .pl-lobby-status { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .pl-lobby-status b { color: var(--acc); }
  .pl-next-btn {
    flex: 0 0 auto;
    width: auto;
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    border-radius: 8px;
    padding: 6px 16px;
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .pl-next-btn:hover { background: rgba(255, 255, 255, 0.15); }

  /* Fixed Bottom-Right Bar: Summary + MAÇA BAŞLA */
  .pl-bottom-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(7, 13, 20, 0.85);
    border: 1px solid var(--border);
  }
  .pl-summary {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pl-start-slot { flex: 0 0 auto; }
  .pl-start-btn {
    margin: 0;
    width: auto;
    padding: 10px 26px;
    border-radius: 10px;
    border: 0;
    background: var(--acc);
    color: #0b1520;
    font-family: var(--head-font);
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 1px;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(216, 245, 58, 0.25);
    transition: transform 160ms ease, box-shadow 160ms ease;
  }
  .pl-start-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 26px rgba(216, 245, 58, 0.38);
  }

  /* Responsive: 1024x640 compact fit & <700px single column */
  @media (max-height: 700px) {
    .pl-preview-stage { min-height: 130px; }
    .pl-stat-row { gap: 4px; }
    .pl-tab { padding: 5px 6px; }
    .pl-start-btn { padding: 8px 20px; font-size: 18px; }
  }
  @media (max-width: 960px) {
    .pl-char-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .pl-venue-grid, .pl-racket-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 700px) {
    .panel { overflow-y: auto; }
    .pl-shell { height: auto; min-height: 100%; }
    .pl-main { grid-template-columns: 1fr; }
    .pl-preview-stage { min-height: 220px; }
    .pl-char-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pl-venue-grid, .pl-racket-grid, .pl-mode-grid, .pl-ctrl-grid { grid-template-columns: 1fr; }
    .pl-bottom-bar { flex-direction: column; align-items: stretch; text-align: center; }
    .pl-start-btn { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* Match HUD */
  /* broadcast-style score board: one row per team, games per set, current point, serve marker */
  #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(10,18,28,.9); backdrop-filter: blur(10px); border: 1px solid #ffffff1a; border-radius: 10px; padding: 6px 10px 8px; z-index: 2; min-width: 300px; }

  }
  .cr-left-curr span { display: block; font-size: 9.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-weight: 700; }
  .cr-left-curr b { font-family: var(--head-font); font-size: 15px; font-weight: 800; color: var(--acc); font-variant-numeric: tabular-nums; }
  .cr-left-curr.rp b { color: #6ec6ff; }
  .cr-left-curr.wr b { color: #fff; }

  /* Hub Navigation Grid */
  .cr-hub-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .cr-hub-card {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 6px;
    padding: 12px 14px;
    min-height: 76px;
  }
  .cr-hub-card.is-primary {
    border-color: rgba(216, 245, 58, 0.55);
    background: linear-gradient(135deg, rgba(32, 54, 78, 0.92), rgba(18, 32, 48, 0.9));
  }
  .cr-hub-card:disabled, .cr-hub-card.is-disabled {
    opacity: 0.48;
    cursor: not-allowed;
    transform: none !important;
  }
  .cr-hub-card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .cr-soon-pill {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  /* Creator Form */
  .cr-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }
  .cr-field {
    background: rgba(12, 22, 34, 0.65);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .cr-field.is-full { grid-column: 1 / -1; }
  .cr-field-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-family: var(--head-font);
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .cr-field-head b { color: #fff; font-variant-numeric: tabular-nums; }
  .cr-input, .cr-select {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: #101e2c;
    color: #fff;
    font: inherit;
    font-weight: 600;
  }
  .cr-range { width: 100%; accent-color: var(--acc); cursor: pointer; }
  .cr-swatches { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .cr-swatch {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, 0.22);
    padding: 0;
    cursor: pointer;
    transition: transform 120ms ease, border-color 120ms ease;
  }
  .cr-swatch.is-selected { border-color: var(--acc); transform: scale(1.12); box-shadow: 0 0 0 2px #0b1520 inset; }
  .cr-color-input {
    width: 28px;
    height: 26px;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
  }
  .cr-opt-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
  .cr-opt-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    border-radius: 7px;
    padding: 5px 9px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
  }
  .cr-opt-btn:hover:not(:disabled) { color: #fff; background: rgba(255, 255, 255, 0.1); }
  .cr-opt-btn.is-selected {
    background: rgba(216, 245, 58, 0.18);
    color: var(--acc);
    border-color: var(--acc);
  }

  /* Partner Grid in Play Screen */
  .cr-partner-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    max-height: 155px;
    overflow-y: auto;
    padding: 2px;
  }
  .cr-partner-card {
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
  }
  .cr-partner-card.is-selected { padding: 5px 7px; }

  /* Reward Screen */
  .cr-reward-box {
    max-width: 480px;
    margin: auto;
    width: 100%;
    background: rgba(12, 22, 34, 0.88);
    border: 1px solid var(--border);
    border-top: 4px solid var(--acc);
    border-radius: 14px;
    padding: 18px 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-sizing: border-box;
  }
  .cr-reward-head { text-align: center; }
  .cr-reward-outcome {
    font-family: var(--head-font);
    font-weight: 800;
    font-size: 32px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--acc);
  }
  .cr-reward-outcome.is-loss { color: #ff8fa3; }
  .cr-reward-score { font-size: 15px; font-weight: 700; color: #fff; margin-top: 2px; }
  .cr-reward-lines {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px 0;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .cr-reward-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    color: var(--muted);
  }
  .cr-reward-row b { color: #fff; }
  .cr-reward-row.is-mult { color: #6ec6ff; font-weight: 700; }
  .cr-reward-row.is-mult b { color: #6ec6ff; }
  .cr-reward-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: var(--head-font);
    font-size: 22px;
    font-weight: 800;
    text-transform: uppercase;
  }
  .cr-reward-total b { color: var(--acc); font-size: 26px; }
  .cr-reward-balance {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
  }
  .cr-reward-balance b { color: #fff; }

  /* Profile Screen & Messages */
  .cr-msg {
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12.5px;
    font-weight: 700;
  }
  .cr-msg-error {
    background: rgba(230, 57, 70, 0.2);
    border: 1px solid rgba(230, 57, 70, 0.65);
    color: #ff8fa3;
  }
  .cr-msg-ok {
    background: rgba(46, 204, 113, 0.18);
    border: 1px solid rgba(46, 204, 113, 0.55);
    color: #a9f5c8;
  }
  .cr-delete-box {
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(230, 57, 70, 0.14);
    border: 1px solid rgba(230, 57, 70, 0.55);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .pl-career-top-btn:focus-visible, .cr-btn:focus-visible, .cr-opt-btn:focus-visible,
  .cr-swatch:focus-visible, .cr-input:focus-visible, .cr-select:focus-visible,
  .cr-range:focus-visible, .cr-color-input:focus-visible {
    outline: 2px solid var(--acc) !important;
    outline-offset: 2px !important;
  }
  @media (max-width: 700px) {
    .cr-form-grid, .cr-hub-grid { grid-template-columns: 1fr; }
    .cr-partner-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="menu" class="panel">
  <div class="card">
    <h1>PADEL <b>LEGENDS</b></h1>
    <div class="sub">Quick match · 1–4 players · vs AI or friends</div>
    <div class="row">
      <div><label>Mode</label><select id="mode"><option value="4">Doubles (2v2)</option><option value="2">Singles (1v1)</option></select></div>
      <div><label>Human players</label><select id="humans"><option value="0">0 (watch)</option><option selected>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="row">
      <div><label>Player</label><select id="char"></select></div>
      <div><label>AI level</label><select id="ai"><option value="rookie">Rookie</option><option value="club" selected>Club</option><option value="pro">Pro</option><option value="legend">Legend</option></select></div>
    </div>
    <div class="row">
      <div><label>Venue</label><select id="venue"></select></div>
      <div><label>Racket</label><select id="racket"></select></div>
    </div>
    <div class="row">
      <div><label>Sets</label><select id="sets"><option value="1">1 set</option><option value="3" selected>3 sets</option><option value="3s">2 sets + super tie-break</option></select></div>
      <div><label>Deuce</label><select id="golden"><option value="1">Golden point</option><option value="0">Advantage</option><option value="star">Star Point (FIP 2026)</option></select></div>
    </div>
    <div class="row">
      <div><label>Controls (P1)</label><select id="control"><option value="auto" selected>Keyboard + Xbox controller</option><option value="kb">Keyboard only</option><option value="pad">Xbox controller only</option></select></div>
      <div><label>Game speed</label><select id="speed"><option value="0.7">Slow</option><option value="0.85" selected>Normal</option><option value="1">Fast (real)</option></select></div>
    </div>
    <button class="go" id="start">START MATCH</button>
    <label>Online — play with friends</label>
    <div class="row">
      <div><input id="room" placeholder="Room code (e.g. PADEL1)" maxlength="6"></div>
      <div><button id="online">JOIN / CREATE ROOM</button></div>
    </div>
    <div class="sub" id="lobby" style="margin-top:10px"></div>
    <div class="credits">Developer: <b>Mesut</b> · Main sponsor: <b>MESUT PADEL</b></div>
  </div>
</div>
<div id="hud" hidden>
  <div class="hud-head"><span class="tour">MESUT PADEL TOUR</span><span id="hudLabel">SET 1</span></div>
  <div class="hud-grid" id="hudGrid"></div>
  <div class="hud-style" id="hudStyle"><span class="hs-pts" id="hsPts">STYLE <b>0</b> PTS</span><span class="hs-streak" id="hsStreak" hidden>🔥 x1.5 ON FIRE</span><span class="hs-medals" id="hsMedals"></span></div>
  <span id="t0" hidden>TEAM A</span><span id="t1" hidden>TEAM B</span><span id="setsHud" hidden></span><span id="pts" hidden></span>
</div>
<div id="hypeToast" hidden><span class="ht-text" id="htText"></span><span class="ht-pts" id="htPts"></span></div>
<div id="msg"></div>
<div id="cam" hidden></div>
<div id="shotHint" hidden></div>
<div id="smashVignette" hidden></div>
<div id="smashBanner" hidden><div class="sb-kicker" id="sbKicker"></div><div class="sb-title" id="sbTitle"></div><div class="sb-sub" id="sbSub"></div></div>
<div id="pause" hidden><div class="pz-card"><div class="pz-title">PAUSED</div><div id="pzItems"></div><div id="pzNote" class="pz-note"></div><div class="pz-hint">↑ ↓ select · Enter / A confirm · P / Esc / Start resume</div></div></div>
<div id="replayTag" hidden>● REPLAY <small style="font-weight:600;opacity:.85">· press any key to skip</small></div>
<div id="help" hidden></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
